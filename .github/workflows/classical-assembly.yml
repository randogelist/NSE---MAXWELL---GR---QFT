name: Cached Classical Mechanics assembly

on:
  push:
    paths:
      - 'ASSEMBLY/**'
      - 'Classical_Mechanics_adapter/**'
      - 'B <-> ClassicalMechanics/**/*.lean'
      - 'Fefferman_adapter/NSEMaxwell/**/*.lean'
      - 'Fefferman_adapter/NSEMaxwell.lean'
      - 'Maxwell_Endpoint/MaxwellEndpoint/**/*.lean'
      - 'Maxwell_Endpoint/MaxwellEndpoint.lean'
      - 'Auxillary/assembly/**'
      - 'Auxillary/assembly-*'
      - 'Auxillary/run_assembly.sh'
      - 'Auxillary/run_literature.sh'
      - 'Auxillary/scripts/verify_audit.py'
      - 'Auxillary/scripts/run.ps1'
      - '.github/workflows/classical-assembly.yml'
      - 'lakefile.lean'
      - 'lake-manifest.json'
      - 'lean-toolchain'
  pull_request:
    paths:
      - 'ASSEMBLY/**'
      - 'Classical_Mechanics_adapter/**'
      - 'B <-> ClassicalMechanics/**/*.lean'
      - 'Fefferman_adapter/NSEMaxwell/**/*.lean'
      - 'Fefferman_adapter/NSEMaxwell.lean'
      - 'Maxwell_Endpoint/MaxwellEndpoint/**/*.lean'
      - 'Maxwell_Endpoint/MaxwellEndpoint.lean'
      - 'Auxillary/assembly/**'
      - 'Auxillary/assembly-*'
      - 'Auxillary/run_assembly.sh'
      - 'Auxillary/run_literature.sh'
      - '.github/workflows/classical-assembly.yml'
      - 'lakefile.lean'
      - 'lake-manifest.json'
      - 'lean-toolchain'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: classical-assembly-${{ github.ref }}
  cancel-in-progress: true

jobs:
  assembly-native-linux:
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      ELAN_TOOLCHAIN: leanprover/lean4:v4.34.0-rc1
      MATHLIB_CACHE_DIR: ${{ github.workspace }}/.mathlib-download-cache
      MATHLIB_NO_CACHE_ON_UPDATE: '1'
    steps:
      - name: Check out the exact assembly source commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Set up the source and evidence verifier
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      - name: Record the native external runner
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/assembly
          uname -a > artifacts/assembly/runner-system.txt
          df -h . > artifacts/assembly/runner-disk.txt
          command -v pwsh

      - name: Restore the pinned Linux compiler
        id: elan-cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.elan
          key: nse-compiler-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain') }}

      - name: Activate the cached compiler path
        shell: bash
        run: echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Obtain the pinned compiler only on a compiler-cache miss
        if: steps.elan-cache.outputs.cache-hit != 'true'
        uses: leanprover/lean-action@fe408643ea7367d8c0404a8be3975bb145f5fb64
        with:
          auto-config: 'false'
          build: 'false'
          test: 'false'
          lint: 'false'
          use-mathlib-cache: 'false'
          use-github-cache: 'false'

      - name: Restore the existing pinned dependency caches
        id: deps-cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            .lake/packages
            .lake/config
            .mathlib-download-cache
          key: nse-deps-v2-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lakefile.lean', 'lake-manifest.json', 'Auxillary/cache-targets.txt') }}
          # Exact previously verified dependency locks; sources are checked again.
          restore-keys: |
            nse-deps-v2-Linux-X64-0fcb7bcc7e55bc5e79e91e2cad12ccc5de76f8b2a18f51c798bbe2107711efee
            nse-deps-v2-Linux-X64-1e0a11bbe2f771dc625218fed552a5e8c9ad571990c5e9674d1e2921162b35c5
            nse-deps-v2-Linux-X64-9b51ac59a9bf389c36d0ee08f81eebfa504c2a733df8c25b1187266979e41203

      - name: Verify contained sources and prepare the official incremental cache
        id: dependencies
        shell: bash
        run: bash Auxillary/run.sh -Phase Dependencies

      - name: Preserve verified dependency objects before proof compilation
        if: steps.dependencies.outcome == 'success' && steps.deps-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            .lake/packages
            .lake/config
            .mathlib-download-cache
          key: ${{ steps.deps-cache.outputs.cache-primary-key }}

      - name: Restore assembly or predecessor native project objects
        id: project-cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .lake/build
          key: nse-assembly-project-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lakefile.lean', 'lake-manifest.json', 'Auxillary/cache-targets.txt') }}-${{ hashFiles('ASSEMBLY/**/*.lean', 'Classical_Mechanics_adapter/**/*.lean', 'B <-> ClassicalMechanics/**/*.lean', 'Fefferman_adapter/NSEMaxwell.lean', 'Fefferman_adapter/NSEMaxwell/**/*.lean', 'B <-> Maxwell/**/*.lean', 'Maxwell_Endpoint/MaxwellEndpoint.lean', 'Maxwell_Endpoint/MaxwellEndpoint/**/*.lean') }}
          restore-keys: |
            nse-assembly-project-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lakefile.lean', 'lake-manifest.json', 'Auxillary/cache-targets.txt') }}-
            nse-project-v2-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lakefile.lean', 'lake-manifest.json', 'Auxillary/cache-targets.txt') }}-
            nse-project-v2-Linux-X64-0fcb7bcc7e55bc5e79e91e2cad12ccc5de76f8b2a18f51c798bbe2107711efee-
            nse-project-v2-Linux-X64-1e0a11bbe2f771dc625218fed552a5e8c9ad571990c5e9674d1e2921162b35c5-

      - name: Compile assembly and freshly audit exact endpoint declarations
        shell: bash
        run: bash Auxillary/run_assembly.sh

      - name: Compile the isolated literature route and audit exact authorized axioms
        shell: bash
        run: bash Auxillary/run_literature.sh

      - name: Preserve assembly source, compiler and theorem evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: classical-assembly-lean-${{ github.sha }}-${{ github.run_attempt }}
          path: artifacts/assembly/
          if-no-files-found: error
          retention-days: 30

      - name: Locate reusable compiler and project caches
        id: cache-directories
        if: always()
        shell: bash
        run: |
          if test -x "$HOME/.elan/toolchains/leanprover--lean4---v4.34.0-rc1/bin/lean"; then
            echo "compiler-exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "compiler-exists=false" >> "$GITHUB_OUTPUT"
          fi
          if test -d .lake/build; then
            echo "project-exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "project-exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Preserve the compiler cache after success or failure
        if: always() && steps.elan-cache.outputs.cache-hit != 'true' && steps.cache-directories.outputs.compiler-exists == 'true' && steps.elan-cache.outputs.cache-primary-key != ''
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.elan
          key: ${{ steps.elan-cache.outputs.cache-primary-key }}

      - name: Preserve incremental assembly objects after success or failure
        if: always() && steps.project-cache.outcome == 'success' && steps.project-cache.outputs.cache-hit != 'true' && steps.cache-directories.outputs.project-exists == 'true' && steps.project-cache.outputs.cache-primary-key != ''
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .lake/build
          key: ${{ steps.project-cache.outputs.cache-primary-key }}
