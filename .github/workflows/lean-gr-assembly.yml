name: Cached accelerated GR dependency build and exact audits

on:
  push:
    branches:
      - codex/gr-adapter
    paths:
      - 'ASSEMBLY/**/*.lean'
      - 'ASSEMBLY/lake-manifest.json'
      - 'ASSEMBLY/lakefile.lean'
      - 'ASSEMBLY/lean-toolchain'
      - 'ASSEMBLY/run.cmd'
      - 'ASSEMBLY/run.sh'
      - 'GR_adapter/**/*.lean'
      - 'GR_adapter/lean-toolchain'
      - 'GR_adapter/lake-manifest.json'
      - 'TEMP/**/*.lean'
      - 'TEMP/lean-toolchain'
      - 'TEMP/lake-manifest.json'
      - 'Fefferman_adapter/scripts/hydrate_native_sources.py'
      - 'Fefferman_adapter/native-sources.json'
      - 'Fefferman_adapter/lake-manifest.json'
      - 'Fefferman_adapter/lean-toolchain'
      - 'Fefferman_adapter/NativeSources/**'
      - 'Auxillary/GR/Assembly/scripts/**'
      - 'Auxillary/GR/Assembly/audit-targets.json'
      - 'Auxillary/GR/Assembly/formalization-status.json'
      - '.github/workflows/lean-gr-assembly.yml'
      - '.gitattributes'
  workflow_dispatch:
    inputs:
      checkpoint_run_id:
        description: 'Optional run ID containing a compatible compiled-object checkpoint'
        required: false
        type: string
      checkpoint_attempt:
        description: 'Attempt of the selected checkpoint run'
        required: false
        default: '1'
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: gr-assembly-native-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gr-assembly-native-linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      ELAN_TOOLCHAIN: leanprover/lean4:v4.34.0-rc1
      MATHLIB_CACHE_DIR: ${{ github.workspace }}/.mathlib-download-cache
      MATHLIB_NO_CACHE_ON_UPDATE: '1'
      LEAN_NUM_THREADS: '4'
    steps:
      - name: Check out the exact GR assembly source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Python for the external evidence runner
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'

      - name: Check audit-runner orchestration without invoking Lean
        shell: bash
        run: python -m unittest discover -s Auxillary/GR/Assembly/scripts -p 'test_*.py'

      - name: Identify the compiled-object checkpoint configuration
        id: checkpoint-identity
        shell: bash
        env:
          CONFIG_HASH: ${{ hashFiles('ASSEMBLY/lean-toolchain', 'ASSEMBLY/lakefile.lean', 'ASSEMBLY/lake-manifest.json') }}
        run: echo "config=$CONFIG_HASH" >> "$GITHUB_OUTPUT"

      - name: Restore compatible native compiler
        id: compiler
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ~/.elan
          key: nse-compiler-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('ASSEMBLY/lean-toolchain') }}

      - name: Activate compiler path
        shell: bash
        run: echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Install exact toolchain only on compiler-cache miss
        if: steps.compiler.outputs.cache-hit != 'true'
        uses: leanprover/lean-action@fe408643ea7367d8c0404a8be3975bb145f5fb64
        with:
          auto-config: 'false'
          build: 'false'
          test: 'false'
          lint: 'false'
          use-mathlib-cache: 'false'
          use-github-cache: 'false'

      - name: Verify shared GR dependency cache identity
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          assembly = Path('ASSEMBLY')
          adapter = Path('GR_adapter')
          assert (assembly / 'lean-toolchain').read_bytes() == (adapter / 'lean-toolchain').read_bytes()
          assembly_lock = json.loads((assembly / 'lake-manifest.json').read_text())
          adapter_lock = json.loads((adapter / 'lake-manifest.json').read_text())
          assert assembly_lock['packages'] == adapter_lock['packages']
          print('SHARED_DEPENDENCY_IDENTITY=PASS')
          PY

      - name: Restore pinned dependency and download caches
        id: dependencies-cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            .lake/packages
            .mathlib-download-cache
          key: nse-gr-deps-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('GR_adapter/lean-toolchain', 'GR_adapter/lake-manifest.json') }}
          restore-keys: |
            nse-gr-assembly-deps-v1-${{ runner.os }}-${{ runner.arch }}-
            nse-temp-deps-v1-${{ runner.os }}-${{ runner.arch }}-
            nse-gr-deps-v1-${{ runner.os }}-${{ runner.arch }}-
            nse-deps-v2-Linux-X64-1e0a11bbe2f771dc625218fed552a5e8c9ad571990c5e9674d1e2921162b35c5
            nse-deps-v2-Linux-X64-9b51ac59a9bf389c36d0ee08f81eebfa504c2a733df8c25b1187266979e41203
            nse-deps-v2-Linux-X64-78b8e6dd5376bcb08d2c5af93549e74beae76ba7d0f24dc089ab851faa254f79
            nse-deps-v2-Linux-X64-61a962499c8eb2ab9217aea818efc9c8df3fc4c21642b7007e74a1a069a24416

      - name: Restore exact contained dependency sources and link the verified cache
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p Auxillary/GR/Assembly/evidence-current ASSEMBLY/.lake
          python Fefferman_adapter/scripts/hydrate_native_sources.py \
            --package-root "$GITHUB_WORKSPACE/Fefferman_adapter" \
            --dependency-root "$GITHUB_WORKSPACE/.lake/packages" \
            --report "$GITHUB_WORKSPACE/Auxillary/GR/Assembly/evidence-current/native-source-hydration.json"
          if test ! -e ASSEMBLY/.lake/packages; then
            ln -s ../../.lake/packages ASSEMBLY/.lake/packages
          fi
          test "$(realpath ASSEMBLY/.lake/packages)" = "$GITHUB_WORKSPACE/.lake/packages"

      - name: Verify all pins and acquire only missing official cached objects
        id: dependencies
        shell: bash
        run: bash ASSEMBLY/run.sh --phase dependencies --source-commit "$GITHUB_SHA"

      - name: Preserve verified dependency cache before compiling GR assembly proofs
        if: steps.dependencies.outcome == 'success' && steps.dependencies-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            .lake/packages
            .mathlib-download-cache
          key: ${{ steps.dependencies-cache.outputs.cache-primary-key }}

      - name: Restore existing GR project objects for compatible seed reuse
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: GR_adapter/.lake/build
          key: nse-gr-project-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('GR_adapter/lean-toolchain', 'GR_adapter/lakefile.lean', 'GR_adapter/lake-manifest.json') }}-${{ hashFiles('GR_adapter/GRAdapter.lean', 'GR_adapter/GRAdapter/**/*.lean', 'GR_adapter/NSEGRForward.lean', 'GR_adapter/NSEGRForward/**/*.lean', 'GR_adapter/NSEGRReverse.lean', 'GR_adapter/NSEGRReverse/**/*.lean') }}
          restore-keys: |
            nse-gr-project-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('GR_adapter/lean-toolchain', 'GR_adapter/lakefile.lean', 'GR_adapter/lake-manifest.json') }}-

      - name: Restore existing TEMP project objects for compatible seed reuse
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: TEMP/.lake/build
          key: nse-temp-project-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('TEMP/lean-toolchain', 'TEMP/lakefile.lean', 'TEMP/lake-manifest.json') }}-${{ hashFiles('TEMP/**/*.lean', 'Auxillary/TEMP/audit-targets.json', 'Auxillary/TEMP/scripts/run_temp.py') }}
          restore-keys: |
            nse-temp-project-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('TEMP/lean-toolchain', 'TEMP/lakefile.lean', 'TEMP/lake-manifest.json') }}-

      - name: Restore incremental GR assembly project objects
        id: project-cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ASSEMBLY/.lake/build
          key: nse-gr-assembly-checkpoint-v2-${{ runner.os }}-${{ runner.arch }}-${{ steps.checkpoint-identity.outputs.config }}-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            nse-gr-assembly-checkpoint-v2-${{ runner.os }}-${{ runner.arch }}-${{ steps.checkpoint-identity.outputs.config }}-${{ github.sha }}-
            nse-gr-assembly-checkpoint-v2-${{ runner.os }}-${{ runner.arch }}-${{ steps.checkpoint-identity.outputs.config }}-
            nse-gr-assembly-project-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.checkpoint-identity.outputs.config }}-

      - name: Verify the selected checkpoint run provenance
        id: checkpoint-run
        if: inputs.checkpoint_run_id != ''
        shell: bash
        env:
          CHECKPOINT_RUN_ID: ${{ inputs.checkpoint_run_id }}
          CHECKPOINT_ATTEMPT: ${{ inputs.checkpoint_attempt || '1' }}
          GH_CHECKPOINT_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python - <<'PY'
          import json, os, urllib.request
          run_id = os.environ['CHECKPOINT_RUN_ID']
          attempt = os.environ['CHECKPOINT_ATTEMPT']
          assert run_id.isascii() and run_id.isdecimal()
          assert attempt.isascii() and attempt.isdecimal() and int(attempt) >= 1
          repository = os.environ['GITHUB_REPOSITORY']
          url = 'https://api.github.com/repos/' + repository + '/actions/runs/' + run_id
          request = urllib.request.Request(url, headers={
              'Authorization': 'Bearer ' + os.environ['GH_CHECKPOINT_TOKEN'],
              'Accept': 'application/vnd.github+json',
              'X-GitHub-Api-Version': '2022-11-28',
          })
          with urllib.request.urlopen(request, timeout=30) as response:
              run = json.load(response)
          assert run['repository']['full_name'] == repository
          assert run['head_repository']['full_name'] == repository
          assert run['path'] == '.github/workflows/lean-gr-assembly.yml'
          assert run['event'] in ('push', 'workflow_dispatch')
          assert run['head_branch'] == 'codex/gr-adapter'
          assert run['status'] == 'completed'
          assert int(attempt) <= run['run_attempt']
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('source_commit=' + run['head_sha'] + '\n')
          print('COMPILED_OBJECT_CHECKPOINT_RUN_PROVENANCE=PASS')
          PY

      - name: Recover an explicitly selected compiled-object checkpoint
        if: inputs.checkpoint_run_id != ''
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: gr-assembly-build-${{ inputs.checkpoint_run_id }}-${{ inputs.checkpoint_attempt || '1' }}
          path: ${{ runner.temp }}/gr-assembly-checkpoint
          run-id: ${{ inputs.checkpoint_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify selected checkpoint compatibility and seed missing objects
        if: inputs.checkpoint_run_id != ''
        shell: bash
        env:
          CHECKPOINT_DIR: ${{ runner.temp }}/gr-assembly-checkpoint
          CONFIG_HASH: ${{ steps.checkpoint-identity.outputs.config }}
          CHECKPOINT_OS: ${{ runner.os }}
          CHECKPOINT_ARCH: ${{ runner.arch }}
          CHECKPOINT_RUN_ID: ${{ inputs.checkpoint_run_id }}
          CHECKPOINT_ATTEMPT: ${{ inputs.checkpoint_attempt || '1' }}
          CHECKPOINT_SOURCE_COMMIT: ${{ steps.checkpoint-run.outputs.source_commit }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os
          from pathlib import Path
          checkpoint = json.loads((Path(os.environ['CHECKPOINT_DIR']) / 'ci-checkpoint.json').read_text())
          assert checkpoint['format'] == 1
          assert checkpoint['config_hash'] == os.environ['CONFIG_HASH']
          assert checkpoint['os'] == os.environ['CHECKPOINT_OS']
          assert checkpoint['arch'] == os.environ['CHECKPOINT_ARCH']
          assert checkpoint['toolchain'] == Path('ASSEMBLY/lean-toolchain').read_text().strip()
          assert checkpoint['run_id'] == os.environ['CHECKPOINT_RUN_ID']
          assert checkpoint['run_attempt'] == os.environ['CHECKPOINT_ATTEMPT']
          assert checkpoint['source_commit'] == os.environ['CHECKPOINT_SOURCE_COMMIT']
          print('COMPILED_OBJECT_CHECKPOINT_COMPATIBILITY=PASS; fresh build and audits remain required')
          PY
          mkdir -p ASSEMBLY/.lake/build
          rsync -a --ignore-existing "$CHECKPOINT_DIR/" ASSEMBLY/.lake/build/

      - name: Seed missing compatible objects without replacing assembly cache files
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ASSEMBLY/.lake/build
          if test -d GR_adapter/.lake/build; then
            rsync -a --ignore-existing GR_adapter/.lake/build/ ASSEMBLY/.lake/build/
          fi
          if test -d TEMP/.lake/build; then
            rsync -a --ignore-existing TEMP/.lake/build/ ASSEMBLY/.lake/build/
          fi

      - name: Build the parallel dependency graph and audit exact endpoints
        id: build
        shell: bash
        run: bash ASSEMBLY/run.sh --phase build --dag-build --batch-audits --individual-modules --keep-going --source-commit "$GITHUB_SHA"

      - name: Verify exact source and raw theorem evidence without invoking Lean
        id: evidence-verification
        if: always() && steps.build.outcome != 'skipped'
        shell: bash
        run: |
          python Auxillary/GR/Assembly/scripts/verify_assembly.py \
            --repository-root "$GITHUB_WORKSPACE" \
            --evidence-directory "$GITHUB_WORKSPACE/Auxillary/GR/Assembly/evidence-current" \
            --source-commit "$GITHUB_SHA" --allow-partial \
            > Auxillary/GR/Assembly/evidence-current/evidence-verification.json

      - name: Record the compiled-object checkpoint provenance
        id: checkpoint-metadata
        if: always() && steps.dependencies.outcome == 'success' && steps.build.outcome != 'skipped'
        shell: bash
        env:
          CONFIG_HASH: ${{ steps.checkpoint-identity.outputs.config }}
          CHECKPOINT_OS: ${{ runner.os }}
          CHECKPOINT_ARCH: ${{ runner.arch }}
          BUILD_OUTCOME: ${{ steps.build.outcome }}
          EVIDENCE_VERIFICATION: ${{ steps.evidence-verification.outcome }}
          RESTORED_CACHE_KEY: ${{ steps.project-cache.outputs.cache-matched-key }}
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          evidence = Path('Auxillary/GR/Assembly/evidence-current')
          summary_path = evidence / 'audit-summary.json'
          summary = json.loads(summary_path.read_text()) if summary_path.exists() else {}
          metadata = {
              'format': 1,
              'config_hash': os.environ['CONFIG_HASH'],
              'os': os.environ['CHECKPOINT_OS'],
              'arch': os.environ['CHECKPOINT_ARCH'],
              'toolchain': Path('ASSEMBLY/lean-toolchain').read_text().strip(),
              'source_commit': os.environ['GITHUB_SHA'],
              'run_id': os.environ['GITHUB_RUN_ID'],
              'run_attempt': os.environ['GITHUB_RUN_ATTEMPT'],
              'build_outcome': os.environ['BUILD_OUTCOME'],
              'evidence_verification': os.environ['EVIDENCE_VERIFICATION'],
              'restored_cache_key': os.environ.get('RESTORED_CACHE_KEY', ''),
              'audit_summary': summary,
              'authority': 'compiled-object seed only; current-source build and fresh theorem audits required',
          }
          build = Path('ASSEMBLY/.lake/build')
          build.mkdir(parents=True, exist_ok=True)
          payload = json.dumps(metadata, indent=2) + '\n'
          (build / 'ci-checkpoint.json').write_text(payload)
          (evidence / 'compiled-object-checkpoint.json').write_text(payload)
          PY

      - name: Retain matching compiler source and theorem evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: gr-assembly-native-linux-${{ github.sha }}-${{ github.run_attempt }}
          path: Auxillary/GR/Assembly/evidence-current/
          if-no-files-found: error
          retention-days: 30

      - name: Identify cache directories without deleting objects
        id: cache-state
        if: always()
        shell: bash
        run: |
          if test -d ASSEMBLY/.lake/build; then echo "project=true" >> "$GITHUB_OUTPUT"; fi
          if test -x "$HOME/.elan/toolchains/leanprover--lean4---v4.34.0-rc1/bin/lean"; then echo "compiler=true" >> "$GITHUB_OUTPUT"; fi

      - name: Preserve compiler after either proof outcome
        if: always() && steps.compiler.outputs.cache-hit != 'true' && steps.cache-state.outputs.compiler == 'true' && steps.compiler.outputs.cache-primary-key != ''
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ~/.elan
          key: ${{ steps.compiler.outputs.cache-primary-key }}

      - name: Preserve incremental GR assembly objects after either proof outcome
        if: always() && steps.checkpoint-metadata.outcome == 'success' && steps.project-cache.outputs.cache-hit != 'true' && steps.cache-state.outputs.project == 'true' && steps.project-cache.outputs.cache-primary-key != ''
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ASSEMBLY/.lake/build
          key: ${{ steps.project-cache.outputs.cache-primary-key }}

      - name: Retain a recoverable compiled-object checkpoint after either proof outcome
        if: always() && steps.checkpoint-metadata.outcome == 'success' && steps.cache-state.outputs.project == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: gr-assembly-build-${{ github.run_id }}-${{ github.run_attempt }}
          path: ASSEMBLY/.lake/build/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
